<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Web — 网页端 AI 编程助手</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="/libs/github.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="light-theme">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="brand-info">
            <span class="brand-title">Antigravity Web</span>
            <span class="brand-badge">CLI Backend</span>
          </div>
        </div>
        <button class="icon-btn" id="newChatBtn" title="新建会话 (Ctrl+K)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <div class="search-input-wrapper">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索历史会话...">
        </div>
      </div>

      <div class="session-list" id="sessionList">
        <div class="loading-placeholder">正在加载会话...</div>
      </div>

      <div class="sidebar-footer">
        <div class="cwd-badge" id="cwdBadge" title="点击更改工作目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="cwd-text" id="cwdText">/root</span>
        </div>
        <div class="status-indicator" title="CLI 后台就绪">
          <span class="status-dot"></span>
          <span class="status-label">CLI Ready</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="nav-left">
          <button class="icon-btn mobile-menu-btn" id="toggleSidebarBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="chat-title-wrapper">
            <h1 class="chat-title" id="chatTitle">新会话</h1>
            <span class="chat-conv-id" id="chatConvId">未连接会话</span>
          </div>
        </div>

        <div class="nav-right">
          
          <button class="icon-btn" id="themeToggleBtn" title="切换深色/浅色主题">
            <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          
          <div class="speed-selector-wrapper">
            <select id="effortSelect" class="speed-select" title="调节思考深度与回答速度">
              <option value="low" selected>⚡ 极速模式 (Fast)</option>
              <option value="medium">⚖️ 平衡模式 (Balanced)</option>
              <option value="high">🧠 深度思考 (Deep)</option>
            </select>
          </div>

          <div class="model-selector-wrapper">
            <span class="model-badge">Gemini 3.8 Flash</span>
          </div>
          <button class="action-btn danger-btn" id="abortBtn" style="display: none;" title="终止正在运行的命令">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
            <span>停止执行</span>
          </button>
          <button class="icon-btn" id="clearChatBtn" title="清空视图">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages Stream Container -->
      <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <h2>有什么我可以帮你的？</h2>
          <p>当前页面已直连本地 Antigravity CLI 后台，支持实时流式回答、思考链展示、命令与工具执行。</p>

          <div class="quick-prompts">
            <button class="quick-prompt-btn" data-prompt="列出当前目录下的所有文件并简要介绍其结构">
              <div class="qp-icon">📂</div>
              <div class="qp-text">
                <span class="qp-title">浏览当前目录</span>
                <span class="qp-desc">查看工作空间下的文件与子目录</span>
              </div>
            </button>
            <button class="quick-prompt-btn" data-prompt="检查服务器的CPU、内存占用与网络监听端口">
              <div class="qp-icon">⚡</div>
              <div class="qp-text">
                <span class="qp-title">检查系统资源</span>
                <span class="qp-desc">使用 run_command 执行系统体检</span>
              </div>
            </button>
            <button class="quick-prompt-btn" data-prompt="查看当前 Git 仓库的最新提交记录和分支状态">
              <div class="qp-icon">🌿</div>
              <div class="qp-text">
                <span class="qp-title">Git 状态与提交</span>
                <span class="qp-desc">检查最近修改与版本树</span>
              </div>
            </button>
            <button class="quick-prompt-btn" data-prompt="在当前目录写一个支持并发测试的 Python 快速验证脚本">
              <div class="qp-icon">💻</div>
              <div class="qp-text">
                <span class="qp-title">编写测试脚本</span>
                <span class="qp-desc">自动生成并落地代码文件</span>
              </div>
            </button>
          </div>
        </div>

        <div class="message-list" id="messageList"></div>
      </div>

      <!-- Input Dock -->
      <footer class="input-dock">
        <div class="input-container">
          <textarea
            id="promptInput"
            placeholder="输入指令或提问，支持自主调用各种工具... (Enter 发送，Shift+Enter 换行)"
            rows="1"
          ></textarea>
          <div class="input-actions">
            <div class="input-hints">
              <span>按 <b>Enter</b> 发送 / <b>Shift+Enter</b> 换行</span>
            </div>
            <button class="send-btn" id="sendBtn" disabled title="发送 (Enter)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- Modal for changing CWD -->
  <div class="modal-overlay" id="cwdModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>更改工作目录 (Cwd)</h3>
        <button class="icon-btn" id="closeCwdModal">&times;</button>
      </div>
      <div class="modal-body">
        <p>输入新的工作目录路径（需为存在的绝对路径）：</p>
        <input type="text" id="newCwdInput" class="text-input" placeholder="/root">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelCwdModal">取消</button>
        <button class="btn btn-primary" id="saveCwdModal">保存切换</button>
      </div>
    </div>
  </div>

  <!-- Third-party CDN Scripts -->
  <script src="/libs/marked.min.js"></script>
  <script src="/libs/highlight.min.js"></script>
  <!-- Application JS -->
  <script src="/js/render.js"></script>
  <script src="/js/sse.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
